    <circle cx="35" cy="155" r="4" fill="#b07219"/>
    <text x="45" y="159" class="lang-text">Java 9.4%</text>
    <path d="M 215.85598636705984 109.65046308634672 A 65 65 0 0 0 187.28667017992495 131.96968499630873" fill="none" stroke="#b07219" stroke-width="16" stroke-dasharray="36.74119081295754 408.4070449666731" stroke-dashoffset="36.74119081295754" class="arc" />
    <circle cx="35" cy="183" r="4" fill="#3572A5"/>
    <text x="45" y="187" class="lang-text">Python 4.2%</text>
    <path d="M 232.33484634583016 105.45354061253269 A 65 65 0 0 0 217.4440266257144 109.03912676856967" fill="none" stroke="#3572A5" stroke-width="16" stroke-dasharray="15.35208548827436 408.4070449666731" stroke-dashoffset="15.35208548827436" class="arc" />
    <circle cx="35" cy="211" r="4" fill="#663399"/>
    <text x="45" y="215" class="lang-text">CSS 1.1%</text>
    <path d="M 236.6566632809476 105.08604079565755 A 65 65 0 0 0 234.02710233338794 105.27500874110387" fill="none" stroke="#663399" stroke-width="16" stroke-dasharray="2.6365228359652635 408.4070449666731" stroke-dashoffset="2.6365228359652635" class="arc" />
    <circle cx="35" cy="239" r="4" fill="#89e051"/>
    <text x="45" y="243" class="lang-text">Shell 0.1%</text>
    <path d="M 238.9254459399374 105.00888265638139 A 65 65 0 0 0 238.357058313491 105.02076683574411" fill="none" stroke="#89e051" stroke-width="16" stroke-dasharray="0.5685136656500204 408.4070449666731" stroke-dashoffset="0.5685136656500204" class="arc" />
    <circle cx="35" cy="267" r="4" fill="#012456"/>
    <text x="45" y="271" class="lang-text">PowerShell 0.1%</text>
    <path d="M 239.43040798401546 105.0024957022554 A 65 65 0 0 0 238.9254459399374 105.00888265638139" fill="none" stroke="#012456" stroke-width="16" stroke-dasharray="0.5050037049106323 408.4070449666731" stroke-dashoffset="0.5050037049106323" class="arc" />
  </g>
</svg>
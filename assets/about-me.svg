    <rect x="0.5" y="0.5" width="339" height="339" rx="11.5" stroke="#414868" stroke-opacity="0.5"/>
    <text x="30" y="45" class="title">Most Used Languages</text>
    <circle cx="35" cy="71" r="4" fill="#00ADD8"/>

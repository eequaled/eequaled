    <circle cx="35" cy="183" r="4" fill="#3572A5"/>
    <text x="45" y="187" class="lang-text">Python 4.2%</text>
    <path d="M 232.29839245031997 105.45788010027319 A 65 65 0 0 0 217.3114843550784 109.08833233418947" fill="none" stroke="#3572A5" stroke-width="16" stroke-dasharray="15.456755432566673 408.4070449666731" stroke-dashoffset="15.456755432566673" class="arc" />
    <circle cx="35" cy="211" r="4" fill="#663399"/>
    <text x="45" y="215" class="lang-text">CSS 1.1%</text>
    <path d="M 236.64659181458487 105.08656030110566 A 65 65 0 0 0 233.99054733517102 105.27839249007191" fill="none" stroke="#663399" stroke-width="16" stroke-dasharray="2.663149254617082 408.4070449666731" stroke-dashoffset="2.663149254617082" class="arc" />
    <circle cx="35" cy="239" r="4" fill="#89e051"/>
    <text x="45" y="243" class="lang-text">Shell 0.1%</text>
    <path d="M 238.91885132209327 105.00899202554048 A 65 65 0 0 0 238.346976699301 105.02102252291634" fill="none" stroke="#89e051" stroke-width="16" stroke-dasharray="0.572002996956494 408.4070449666731" stroke-dashoffset="0.572002996956494" class="arc" />
    <circle cx="35" cy="267" r="4" fill="#012456"/>
    <text x="45" y="271" class="lang-text">PowerShell 0.1%</text>
    <path d="M 239.4269121244968 105.00252643150696 A 65 65 0 0 0 238.91885132209327 105.00899202554048" fill="none" stroke="#012456" stroke-width="16" stroke-dasharray="0.5081032350431491 408.4070449666731" stroke-dashoffset="0.5081032350431491" class="arc" />
  </g>

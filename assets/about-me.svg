    <circle cx="35" cy="155" r="4" fill="#3572A5"/>
    <text x="45" y="159" class="lang-text">Python 4.5%</text>
    <path d="M 216.22550358198814 109.50393963182444 A 65 65 0 0 0 201.7057662671282 117.47808397618967" fill="none" stroke="#3572A5" stroke-width="16" stroke-dasharray="16.610477671884492 408.4070449666731" stroke-dashoffset="16.610477671884492" class="arc" />
    <circle cx="35" cy="183" r="4" fill="#f1e05a"/>
    <text x="45" y="187" class="lang-text">JavaScript 4.1%</text>
    <path d="M 232.38083640229343 105.44809572079703 A 65 65 0 0 0 217.81725275321702 108.90232635700977" fill="none" stroke="#f1e05a" stroke-width="16" stroke-dasharray="15.00088877070365 408.4070449666731" stroke-dashoffset="15.00088877070365" class="arc" />
    <circle cx="35" cy="211" r="4" fill="#663399"/>
    <text x="45" y="215" class="lang-text">CSS 1.2%</text>
    <path d="M 237.12097076094756 105.0637913746061 A 65 65 0 0 0 234.07321916085698 105.27076959452734" fill="none" stroke="#663399" stroke-width="16" stroke-dasharray="3.0550528385082822 408.4070449666731" stroke-dashoffset="3.0550528385082822" class="arc" />
    <circle cx="35" cy="239" r="4" fill="#012456"/>
    <text x="45" y="243" class="lang-text">PowerShell 0.1%</text>
    <path d="M 239.375458166553 105.00300047311204 A 65 65 0 0 0 238.82178910885864 105.0106791919165" fill="none" stroke="#012456" stroke-width="16" stroke-dasharray="0.5537239767281816 408.4070449666731" stroke-dashoffset="0.5537239767281816" class="arc" />
    <circle cx="35" cy="267" r="4" fill="#e34c26"/>
    <text x="45" y="271" class="lang-text">HTML 0.1%</text>
    <path d="M 239.8438622892884 105.0001875309221 A 65 65 0 0 0 239.375458166553 105.00300047311204" fill="none" stroke="#e34c26" stroke-width="16" stroke-dasharray="0.46841358260667754 408.4070449666731" stroke-dashoffset="0.46841358260667754" class="arc" />
  </g>
</svg>
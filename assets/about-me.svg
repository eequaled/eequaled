    <circle cx="35" cy="155" r="4" fill="#3572A5"/>
    <text x="45" y="159" class="lang-text">Python 4.5%</text>
    <path d="M 215.7117149449587 109.70838193343079 A 65 65 0 0 0 201.28142116701 117.79011919996812" fill="none" stroke="#3572A5" stroke-width="16" stroke-dasharray="16.584228556187714 408.4070449666731" stroke-dashoffset="16.584228556187714" class="arc" />
    <circle cx="35" cy="183" r="4" fill="#f1e05a"/>
    <text x="45" y="187" class="lang-text">JavaScript 4.2%</text>
    <path d="M 232.3892852276528 105.44709905314885 A 65 65 0 0 0 217.29828850316017 109.09324918275274" fill="none" stroke="#f1e05a" stroke-width="16" stroke-dasharray="15.562367482444653 408.4070449666731" stroke-dashoffset="15.562367482444653" class="arc" />
    <circle cx="35" cy="211" r="4" fill="#663399"/>
    <text x="45" y="215" class="lang-text">CSS 1.2%</text>
    <path d="M 237.1226580730356 105.06371658744756 A 65 65 0 0 0 234.08169118073243 105.26999443287696" fill="none" stroke="#663399" stroke-width="16" stroke-dasharray="3.0482343988603247 408.4070449666731" stroke-dashoffset="3.0482343988603247" class="arc" />
    <circle cx="35" cy="239" r="4" fill="#012456"/>
    <text x="45" y="243" class="lang-text">PowerShell 0.1%</text>
    <path d="M 239.37635337253437 105.0029918774406 A 65 65 0 0 0 238.82347780044657 105.01064859906695" fill="none" stroke="#012456" stroke-width="16" stroke-dasharray="0.5529302552960226 408.4070449666731" stroke-dashoffset="0.5529302552960226" class="arc" />
    <circle cx="35" cy="267" r="4" fill="#e34c26"/>
    <text x="45" y="271" class="lang-text">HTML 0.1%</text>
    <path d="M 239.84408610045557 105.0001869936849 A 65 65 0 0 0 239.37635337253437 105.0029918774406" fill="none" stroke="#e34c26" stroke-width="16" stroke-dasharray="0.4677421471708739 408.4070449666731" stroke-dashoffset="0.4677421471708739" class="arc" />
  </g>
</svg>
    <circle cx="35" cy="155" r="4" fill="#3572A5"/>
    <text x="45" y="159" class="lang-text">Python 19.6%</text>
    <path d="M 207.34501232505573 113.79811586833375 A 65 65 0 0 0 175.8203820100866 180.29449535765525" fill="none" stroke="#3572A5" stroke-width="16" stroke-dasharray="78.22675881712084 408.4070449666731" stroke-dashoffset="78.22675881712084" class="arc" />
    <circle cx="35" cy="183" r="4" fill="#b07219"/>
    <text x="45" y="187" class="lang-text">Java 6.3%</text>
    <path d="M 231.60390370411335 105.54454587088694 A 65 65 0 0 0 208.8273961894751 112.96256692599107" fill="none" stroke="#b07219" stroke-width="16" stroke-dasharray="24.091709832118987 408.4070449666731" stroke-dashoffset="24.091709832118987" class="arc" />
    <circle cx="35" cy="211" r="4" fill="#663399"/>
    <text x="45" y="215" class="lang-text">CSS 1.0%</text>
    <path d="M 235.74340274444066 105.13952374670716 A 65 65 0 0 0 233.29402792751506 105.34684896648075" fill="none" stroke="#663399" stroke-width="16" stroke-dasharray="2.4582800924575565 408.4070449666731" stroke-dashoffset="2.4582800924575565" class="arc" />
    <circle cx="35" cy="239" r="4" fill="#e34c26"/>
    <text x="45" y="243" class="lang-text">HTML 0.3%</text>
    <path d="M 238.73980020001625 105.01221732922318 A 65 65 0 0 0 237.44271070811573 105.05032508566642" fill="none" stroke="#e34c26" stroke-width="16" stroke-dasharray="1.2976707136369001 408.4070449666731" stroke-dashoffset="1.2976707136369001" class="arc" />
    <circle cx="35" cy="267" r="4" fill="#012456"/>
    <text x="45" y="271" class="lang-text">PowerShell 0.1%</text>
    <path d="M 239.29163076733474 105.00386001438075 A 65 65 0 0 0 238.73980020001625 105.01221732922318" fill="none" stroke="#012456" stroke-width="16" stroke-dasharray="0.5518955060523294 408.4070449666731" stroke-dashoffset="0.5518955060523294" class="arc" />
  </g>
</svg>
    <circle cx="35" cy="155" r="4" fill="#3572A5"/>
    <text x="45" y="159" class="lang-text">Python 18.0%</text>
    <path d="M 205.52084020166456 114.89838895639394 A 65 65 0 0 0 175.2990107258185 176.2275185220321" fill="none" stroke="#3572A5" stroke-width="16" stroke-dasharray="71.99541748797462 408.4070449666731" stroke-dashoffset="71.99541748797462" class="arc" />
    <circle cx="35" cy="183" r="4" fill="#b07219"/>
    <text x="45" y="187" class="lang-text">Java 7.0%</text>
    <path d="M 232.17377677907564 105.47287213817536 A 65 65 0 0 0 206.97504737256023 114.01471171856522" fill="none" stroke="#b07219" stroke-width="16" stroke-dasharray="26.796475968026364 408.4070449666731" stroke-dashoffset="26.796475968026364" class="arc" />
    <circle cx="35" cy="211" r="4" fill="#663399"/>
    <text x="45" y="215" class="lang-text">CSS 1.0%</text>
    <path d="M 236.28216856263114 105.1064122628182 A 65 65 0 0 0 233.8655819208037 105.29011733259263" fill="none" stroke="#663399" stroke-width="16" stroke-dasharray="2.4236994744298235 408.4070449666731" stroke-dashoffset="2.4236994744298235" class="arc" />
    <circle cx="35" cy="239" r="4" fill="#e34c26"/>
    <text x="45" y="243" class="lang-text">HTML 0.3%</text>
    <path d="M 239.07826870639198 105.00653562532318 A 65 65 0 0 0 237.98215866231845 105.03132819322883" fill="none" stroke="#e34c26" stroke-width="16" stroke-dasharray="1.0964033937165427 408.4070449666731" stroke-dashoffset="1.0964033937165427" class="arc" />
    <circle cx="35" cy="267" r="4" fill="#89e051"/>
    <text x="45" y="271" class="lang-text">Shell 0.1%</text>
    <path d="M 239.49968873544842 105.00192550053069 A 65 65 0 0 0 239.07826870639198 105.00653562532318" fill="none" stroke="#89e051" stroke-width="16" stroke-dasharray="0.421445982757203 408.4070449666731" stroke-dashoffset="0.421445982757203" class="arc" />
  </g>
</svg>
    <circle cx="35" cy="155" r="4" fill="#f1e05a"/>
    <text x="45" y="159" class="lang-text">JavaScript 8.6%</text>
    <path d="M 214.9596682888347 110.01682079286886 A 65 65 0 0 0 188.65546762064938 130.14101111736758" fill="none" stroke="#f1e05a" stroke-width="16" stroke-dasharray="33.48854613616351 408.4070449666731" stroke-dashoffset="33.48854613616351" class="arc" />
    <circle cx="35" cy="183" r="4" fill="#3572A5"/>
    <text x="45" y="187" class="lang-text">Python 4.4%</text>
    <path d="M 232.0852261479924 105.48367373391773 A 65 65 0 0 0 216.53842556656286 109.38189606145463" fill="none" stroke="#3572A5" stroke-width="16" stroke-dasharray="16.06896146712176 408.4070449666731" stroke-dashoffset="16.06896146712176" class="arc" />
    <circle cx="35" cy="211" r="4" fill="#663399"/>
    <text x="45" y="215" class="lang-text">CSS 1.1%</text>
    <path d="M 236.58768624747267 105.08963014391065 A 65 65 0 0 0 233.7767788809967 105.2985972416054" fill="none" stroke="#663399" stroke-width="16" stroke-dasharray="2.8188850227733107 408.4070449666731" stroke-dashoffset="2.8188850227733107" class="arc" />
    <circle cx="35" cy="239" r="4" fill="#89e051"/>
    <text x="45" y="243" class="lang-text">Shell 0.1%</text>
    <path d="M 238.8802801610993 105.0096451195843 A 65 65 0 0 0 238.28801095853896 105.02254934577752" fill="none" stroke="#89e051" stroke-width="16" stroke-dasharray="0.5924118134207447 408.4070449666731" stroke-dashoffset="0.5924118134207447" class="arc" />
    <circle cx="35" cy="267" r="4" fill="#012456"/>
    <text x="45" y="271" class="lang-text">PowerShell 0.1%</text>
    <path d="M 239.40646515858003 105.00270993039771 A 65 65 0 0 0 238.8802801610993 105.0096451195843" fill="none" stroke="#012456" stroke-width="16" stroke-dasharray="0.52623213598259 408.4070449666731" stroke-dashoffset="0.52623213598259" class="arc" />
  </g>
</svg>
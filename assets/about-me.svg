    <path d="M 207.68762086932625 113.6004418907772 A 65 65 0 0 0 175.610612064328 178.8885725102256" fill="none" stroke="#3572A5" stroke-width="16" stroke-dasharray="77.20078979532185 408.4070449666731" stroke-dashoffset="77.20078979532185" class="arc" />
    <circle cx="35" cy="183" r="4" fill="#b07219"/>
    <text x="45" y="187" class="lang-text">Java 6.4%</text>
    <path d="M 232.1794216624311 105.47218774461706 A 65 65 0 0 0 209.17506183184668 112.77392913252277" fill="none" stroke="#b07219" stroke-width="16" stroke-dasharray="24.276215245756884 408.4070449666731" stroke-dashoffset="24.276215245756884" class="arc" />
    <circle cx="35" cy="211" r="4" fill="#663399"/>
    <text x="45" y="215" class="lang-text">CSS 1.0%</text>
    <path d="M 236.27236579198197 105.10697461813625 A 65 65 0 0 0 233.8712427851334 105.28958093937871" fill="none" stroke="#663399" stroke-width="16" stroke-dasharray="2.4081943662887513 408.4070449666731" stroke-dashoffset="2.4081943662887513" class="arc" />
    <circle cx="35" cy="239" r="4" fill="#e34c26"/>
    <text x="45" y="243" class="lang-text">HTML 0.3%</text>
    <path d="M 239.11906543066618 105.00596985657411 A 65 65 0 0 0 237.9723445300879 105.03163374922119" fill="none" stroke="#e34c26" stroke-width="16" stroke-dasharray="1.147022929232428 408.4070449666731" stroke-dashoffset="1.147022929232428" class="arc" />
    <circle cx="35" cy="267" r="4" fill="#89e051"/>
    <text x="45" y="271" class="lang-text">Shell 0.1%</text>
    <path d="M 239.52412606754424 105.00174199257023 A 65 65 0 0 0 239.11906543066618 105.00596985657411" fill="none" stroke="#89e051" stroke-width="16" stroke-dasharray="0.4050833562037134 408.4070449666731" stroke-dashoffset="0.4050833562037134" class="arc" />
  </g>
</svg>
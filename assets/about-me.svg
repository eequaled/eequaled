    <circle cx="35" cy="155" r="4" fill="#3178c6"/>
    <text x="45" y="159" class="lang-text">TypeScript 22.1%</text>
    <path d="M 206.9562546969769 114.02580151222405 A 65 65 0 0 0 178.44442831742697 190.87849599065058" fill="none" stroke="#3178c6" stroke-width="16" stroke-dasharray="88.69349447906636 408.4070449666731" stroke-dashoffset="88.69349447906636" class="arc" />
    <circle cx="35" cy="183" r="4" fill="#b07219"/>
    <text x="45" y="187" class="lang-text">Java 6.0%</text>
    <path d="M 229.83905876819884 105.79910223926862 A 65 65 0 0 0 208.43281166359546 113.17999805936324" fill="none" stroke="#b07219" stroke-width="16" stroke-dasharray="22.75907165247177 408.4070449666731" stroke-dashoffset="22.75907165247177" class="arc" />
    <circle cx="35" cy="211" r="4" fill="#663399"/>
    <text x="45" y="215" class="lang-text">CSS 1.0%</text>
    <path d="M 233.75192334288153 105.30099275810508 A 65 65 0 0 0 231.52312425098555 105.55511985009383" fill="none" stroke="#663399" stroke-width="16" stroke-dasharray="2.243351399967645 408.4070449666731" stroke-dashoffset="2.243351399967645" class="arc" />
    <circle cx="35" cy="239" r="4" fill="#89e051"/>
    <text x="45" y="243" class="lang-text">Shell 0.5%</text>
    <path d="M 235.94273376902063 105.12674980601824 A 65 65 0 0 0 235.44768697084453 105.1596079123161" fill="none" stroke="#89e051" stroke-width="16" stroke-dasharray="0.49613726187249924 408.4070449666731" stroke-dashoffset="0.49613726187249924" class="arc" />
    <circle cx="35" cy="267" r="4" fill="#e34c26"/>
    <text x="45" y="271" class="lang-text">HTML 0.3%</text>
    <path d="M 238.87247252193436 105.00978010664831 A 65 65 0 0 0 237.6423078097171 105.04277340021451" fill="none" stroke="#e34c26" stroke-width="16" stroke-dasharray="1.230625456121443 408.4070449666731" stroke-dashoffset="1.230625456121443" class="arc" />
  </g>
</svg>
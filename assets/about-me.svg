    <circle cx="35" cy="155" r="4" fill="#b07219"/>
    <text x="45" y="159" class="lang-text">Java 9.4%</text>
    <path d="M 215.97042556943157 109.60480521857909 A 65 65 0 0 0 187.4797397942649 131.70349535633994" fill="none" stroke="#b07219" stroke-width="16" stroke-dasharray="36.53556604579068 408.4070449666731" stroke-dashoffset="36.53556604579068" class="arc" />
    <circle cx="35" cy="183" r="4" fill="#3572A5"/>
    <text x="45" y="187" class="lang-text">Python 4.2%</text>
    <path d="M 232.3666172327399 105.44977561984392 A 65 65 0 0 0 217.5596217962741 108.99648021569786" fill="none" stroke="#3572A5" stroke-width="16" stroke-dasharray="15.260867576693729 408.4070449666731" stroke-dashoffset="15.260867576693729" class="arc" />
    <circle cx="35" cy="211" r="4" fill="#663399"/>
    <text x="45" y="215" class="lang-text">CSS 1.1%</text>
    <path d="M 236.66544044238415 105.08558933059075 A 65 65 0 0 0 234.05896088922722 105.27207670344839" fill="none" stroke="#663399" stroke-width="16" stroke-dasharray="2.6133184068551527 408.4070449666731" stroke-dashoffset="2.6133184068551527" class="arc" />
    <circle cx="35" cy="239" r="4" fill="#89e051"/>
    <text x="45" y="243" class="lang-text">Shell 0.1%</text>
    <path d="M 238.9311930358787 105.00878788887343 A 65 65 0 0 0 238.36584428519126 105.02054528468435" fill="none" stroke="#89e051" stroke-width="16" stroke-dasharray="0.5654727782516231 408.4070449666731" stroke-dashoffset="0.5654727782516231" class="arc" />
    <circle cx="35" cy="267" r="4" fill="#012456"/>
    <text x="45" y="271" class="lang-text">PowerShell 0.1%</text>
    <path d="M 239.4334545619736 105.00246907561294 A 65 65 0 0 0 238.9311930358787 105.00878788887343" fill="none" stroke="#012456" stroke-width="16" stroke-dasharray="0.5023025219924507 408.4070449666731" stroke-dashoffset="0.5023025219924507" class="arc" />
  </g>
</svg>
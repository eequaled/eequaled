    <path d="M 205.17406187184173 115.11690575875215 A 65 65 0 0 0 175.3598661155271 176.8303068304005" fill="none" stroke="#3572A5" stroke-width="16" stroke-dasharray="72.19138750627762 408.4070449666731" stroke-dashoffset="72.19138750627762" class="arc" />
    <circle cx="35" cy="183" r="4" fill="#b07219"/>
    <text x="45" y="187" class="lang-text">Java 7.1%</text>
    <path d="M 232.10161926361258 105.4816647630841 A 65 65 0 0 0 206.62266777197033 114.22407604225876" fill="none" stroke="#b07219" stroke-width="16" stroke-dasharray="27.133669286637577 408.4070449666731" stroke-dashoffset="27.133669286637577" class="arc" />
    <circle cx="35" cy="211" r="4" fill="#663399"/>
    <text x="45" y="215" class="lang-text">CSS 1.0%</text>
    <path d="M 236.2583287629741 105.10778246697056 A 65 65 0 0 0 233.79321896783122 105.2970180809361" fill="none" stroke="#663399" stroke-width="16" stroke-dasharray="2.47251158062861 408.4070449666731" stroke-dashoffset="2.47251158062861" class="arc" />
    <circle cx="35" cy="239" r="4" fill="#e34c26"/>
    <text x="45" y="243" class="lang-text">HTML 0.3%</text>
    <path d="M 239.06736343049013 105.00669119802245 A 65 65 0 0 0 237.95829116420208 105.03207387464316" fill="none" stroke="#e34c26" stroke-width="16" stroke-dasharray="1.1093761520748755 408.4070449666731" stroke-dashoffset="1.1093761520748755" class="arc" />
    <circle cx="35" cy="267" r="4" fill="#89e051"/>
    <text x="45" y="271" class="lang-text">Shell 0.1%</text>
    <path d="M 239.49376911980897 105.00197133530939 A 65 65 0 0 0 239.06736343049013 105.00669119802245" fill="none" stroke="#89e051" stroke-width="16" stroke-dasharray="0.4264325752164495 408.4070449666731" stroke-dashoffset="0.4264325752164495" class="arc" />
  </g>
</svg>
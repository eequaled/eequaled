    <circle cx="35" cy="155" r="4" fill="#f1e05a"/>
    <text x="45" y="159" class="lang-text">JavaScript 4.2%</text>
    <path d="M 226.00472324813433 106.52455412808281 A 65 65 0 0 0 211.35785346213828 111.65081455835346" fill="none" stroke="#f1e05a" stroke-width="16" stroke-dasharray="15.555124012348328 408.4070449666731" stroke-dashoffset="15.555124012348328" class="arc" />
    <circle cx="35" cy="183" r="4" fill="#3572A5"/>
    <text x="45" y="187" class="lang-text">Python 1.5%</text>
    <path d="M 232.1997893112912 105.46972250786649 A 65 65 0 0 0 227.6711125453457 106.17995194196052" fill="none" stroke="#3572A5" stroke-width="16" stroke-dasharray="4.5849813694373545 408.4070449666731" stroke-dashoffset="4.5849813694373545" class="arc" />
    <circle cx="35" cy="211" r="4" fill="#663399"/>
    <text x="45" y="215" class="lang-text">CSS 1.2%</text>
    <path d="M 237.08480806274443 105.06540478320544 A 65 65 0 0 0 233.8916679868839 105.28764971029455" fill="none" stroke="#663399" stroke-width="16" stroke-dasharray="3.2011884442504153 408.4070449666731" stroke-dashoffset="3.2011884442504153" class="arc" />
    <circle cx="35" cy="239" r="4" fill="#012456"/>
    <text x="45" y="243" class="lang-text">PowerShell 0.1%</text>
    <path d="M 239.35627177215554 105.00318766301939 A 65 65 0 0 0 238.78559656859542 105.01134541855946" fill="none" stroke="#012456" stroke-width="16" stroke-dasharray="0.5707353412437928 408.4070449666731" stroke-dashoffset="0.5707353412437928" class="arc" />
    <circle cx="35" cy="267" r="4" fill="#e34c26"/>
    <text x="45" y="271" class="lang-text">HTML 0.1%</text>
    <path d="M 239.83906547665873 105.00019923046536 A 65 65 0 0 0 239.35627177215554 105.00318766301939" fill="none" stroke="#e34c26" stroke-width="16" stroke-dasharray="0.4828040633022555 408.4070449666731" stroke-dashoffset="0.4828040633022555" class="arc" />
  </g>
</svg>